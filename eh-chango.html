const TEMAS=[
 {id:'ip',n:'Calculador IP (Grados de Protección)',items:['ip_estr','ip_1','ip_2','ip_let','ip_ej','ip_ens']},

const KB={

ip_estr:{t:'Cómo se lee el código IP',k:['codigo ip','como se lee','estructura','ip44','x','letras','grado de proteccion','envolvente'],
 p:'<p>El código IP dice qué tan protegida está una envolvente (gabinete, caja, carcasa). Se arma: <b>IP + 1.ª cifra</b> (sólidos y acceso, 0 a 6) <b>+ 2.ª cifra</b> (agua, 0 a 8) <b>+ letra adicional</b> (A a D, opcional) <b>+ letra suplementaria</b> (H, M, S, W, opcional).</p><p>Si una cifra no hace falta se pone <b>X</b> (IPX5, IP2X). Las letras opcionales se omiten sin reemplazo. Un grado alto cumple también los inferiores, hasta la 2.ª cifra 6. Un 7 u 8 solo NO sirve para chorros de agua, salvo doble marcado (IPX5/IPX7).</p>',
 c:IEC+', cap. 4.1 y 4.2 (disposición y elementos del código), cap. 5 y 6 (cumplimiento de grados inferiores).'},
ip_1:{t:'Primera cifra: sólidos y acceso a partes peligrosas',k:['primera cifra','1 cifra','solidos','polvo','dedo','herramienta','alambre','dorso','mano'],

 c:IEC+', cap. 4.2 y cap. 5, Tablas 1 y 2.'},
ip_2:{t:'Segunda cifra: agua',k:['segunda cifra','2 cifra','agua','lluvia','chorro','inmersion','goteo','proyecciones','ipx'],

ip_let:{t:'Letras adicionales y suplementarias',k:['letra adicional','letra suplementaria','letras','a b c d','h m s w','intemperie','alta tension'],

ip_ej:{t:'Ejemplos de designaciones',k:['ejemplo','ip34','ip23cs','ip20c','ipx5','ip2x','ip54','ip65','interpretar'],
 p:'<ul><li><b>IP34</b>: herramientas y sólidos de 2,5 mm o más no entran; protegido contra proyecciones de agua en todas direcciones.</li><li><b>IP23CS</b>: protege de dedos y sólidos de 12,5 mm o más; agua de lluvia; herramienta de 2,5 mm y hasta 100 mm de largo; ensayado con partes en reposo.</li><li><b>IPX5</b> (sin 1.ª cifra), <b>IP2X</b> (sin 2.ª cifra), <b>IP20C</b> (letra adicional), <b>IPX5/IPX7</b> (doble uso: chorros e inmersión temporal).</li></ul>',
 c:IEC+', cap. 4.3, 9.1 y 9.2.'},
ip_ens:{t:'Cómo se ensaya cada grado',k:['ensayo','ensayos','calibre','fuerza','boquilla','camara de polvo','talco','prueba'],
 p:'<ul><li>1.ª cifra 1: esfera de 50 mm con 50 N. Cifra 2: dedo articulado con 10 N. Cifra 3: varilla de 2,5 mm con 3 N. Cifra 4 a 6: alambre de 1 mm con 1 N.</li><li>Cifras 5 y 6: cámara de polvo con talco (2 kg por m³).</li><li>IPX5: boquilla de 6,3 mm, 12,5 l/min, a 2,5 a 3 m, mín. 3 min.</li><li>IPX6: boquilla de 12,5 mm, 100 l/min, misma distancia.</li><li>IPX7: 30 min sumergida (punto más bajo a 1 m si mide menos de 850 mm; punto más alto a 150 mm si mide 850 mm o más).</li></ul>',

/* ---------- TEMA 2: EPP Y DISTANCIAS ---------- */
epp:{t:'EPP y distancias de seguridad',k:['epp','elementos de proteccion','guantes','casco','distancia','distancias de seguridad','ley 19587','ley 19.587','taburete','alfombra'],

 c:REV+' (5.º regla y 3.º regla).'},

/* ---------- TEMA 3: INCENDIOS Y EXTINTORES (Dec. 351/79 Cap. 18) ---------- */
ext_gral:{t:'Cuántos matafuegos y de qué potencial',k:['matafuego','matafuegos','extintor','extintores','cantidad','200 m2','1 a','5 bc','cuantos'],
 p:'<p>Todo edificio debe tener matafuegos de potencial mínimo <b>1 A y 5 BC</b> en cada piso, en lugares accesibles, a razón de <b>1 cada 200 m²</b> de superficie cubierta o fracción. La clase del matafuego tiene que coincidir con la clase de fuego probable.</p><p>Ejemplo: un taller de 450 m² en un piso necesita 3 matafuegos (200 + 200 + la fracción). La autoridad puede exigir más, o instalaciones fijas automáticas.</p>',

ext_A:{t:'Potencial extintor mínimo, fuegos clase A',k:['clase a','potencial','tabla 1','carga de fuego','madera','papel'],
 p:tabla(['Carga de fuego','Riesgo 3 (muy comb.)','Riesgo 4 (comb.)','Riesgo 5 (poco comb.)'],[['hasta 15 kg/m²','1 A','1 A','1 A'],['16 a 30','2 A','1 A','1 A'],['31 a 60','3 A','2 A','1 A'],['61 a 100','6 A','4 A','3 A'],['más de 100','A determinar en cada caso','','']]),
 c:D351+', punto 4.1, Tabla 1.'},
ext_B:{t:'Potencial extintor mínimo, fuegos clase B',k:['clase b','liquidos inflamables','nafta','tabla 2','solventes'],
 p:tabla(['Carga de fuego','Riesgo 2 (inflam.)','Riesgo 3 (muy comb.)'],[['hasta 15 kg/m²','6 B','4 B'],['16 a 30','8 B','6 B'],['31 a 60','10 B','8 B'],['61 a 100','20 B','10 B'],['más de 100','A determinar en cada caso','']])+'<p>Excepción: líquidos inflamables con superficie mayor a 1 m².</p>',
 c:D351+', punto 4.2, Tabla 2.'},
ext_cl:{t:'Clases de fuego C y D',k:['clase c','clase d','electrico','metales','co2','polvo quimico','abc','fuego electrico'],
 p:'<p>Honestamente: el material cargado <b>no define las clases C y D</b> ni qué agente usar en cada una. Sólo fija potenciales para clase A y B, y pide un mínimo de "1 A y 5 BC" por piso. Para eso consultá a los docentes del área.</p>',
 c:D351+', puntos 4.1, 4.2 y 7.1.1.'},
inc_riesgo:{t:'Clasificación de materiales según su combustión (riesgos)',k:['riesgo','riesgos','explosivo','inflamable','combustible','refractario','incombustible','1ra categoria','2da categoria'],
 p:tabla(['Riesgo','Material','Ejemplos'],[['1','Explosivo (sólo fuente de ignición)','Pólvoras, nitroderivados'],['2','Inflamable 1.ª cat. (inflamación ≤ 40 °C) y 2.ª cat. (41 a 120 °C)','Alcohol, nafta, acetona; kerosene, aguarrás'],['3','Muy combustible','Madera, papel, algodón'],['4','Combustible','Ciertos plásticos, cueros, lanas'],['5','Poco combustible','Celulosas artificiales'],['6','Incombustible','Hierro, plomo'],['7','Refractario (hasta 1500 °C)','Ladrillos refractarios']]),
 c:D351+', punto 1.5 (1.5.1 a 1.5.8) y Tabla 2.1.'},
inc_carga:{t:'Carga de fuego y resistencia al fuego',k:['carga de fuego','resistencia al fuego','f 60','f 30','f60','sector de incendio','kg/m2','cuadro'],
 p:'<p>La <b>carga de fuego</b> es el peso en madera por m² (kg/m²) que daría el mismo calor que los materiales del sector (madera patrón de 18,41 MJ/kg). La resistencia (F, en minutos) depende del riesgo y de la carga:</p>'+tabla(['Carga de fuego','R2','R3','R4','R5'],[['hasta 15','F 60','F 30','F 30','-'],['16 a 30','F 90','F 60','F 30','F 30'],['31 a 60','F 120','F 90','F 60','F 30'],['61 a 100','F 180','F 120','F 90','F 60'],['más de 100','F 180','F 180','F 120','F 90']]),
 c:D351+', puntos 1.2, 1.10, 1.11 y Cuadro 2.2.1 (existe también el Cuadro 2.2.2).'},
inc_esc:{t:'Medios de escape: ancho, ocupación y distancias',k:['medios de escape','escape','salida','ancho','unidad de ancho','factor de ocupacion','evacuacion','40 m','caja de escalera','ocupacion'],
 p:'<ul><li>Unidad de ancho de salida: <b>0,55 m</b> las dos primeras y 0,45 m las siguientes. Mínimo permitido: 2 unidades (1,10 m en edificios nuevos).</li><li>n = N / 100 (N: personas según factor de ocupación). Fracciones de 0,5 o más se redondean hacia arriba.</li><li>Factor de ocupación (1 persona cada x m²): trabajo y comercio 3; educación 2; oficinas 8; industrias 16 (o lo declara el dueño); depósitos 30.</li><li>Con 4 o más unidades, cantidad de escapes = n/4 + 1.</li><li>Desde cualquier punto de un piso alto a la caja de escalera: máx. 40 m (20 m en sótanos).</li></ul>',
 c:D351+', puntos 3.1.1, 3.1.2, 3.1.3.2 y 3.2.3.2; 6.1.4 (sótanos).'},
inc_mano:{t:'Escaleras de mano: uso seguro',k:['escalera de mano','escaleras de mano','escalera','altura','trabajar en altura','peldaño'],
 p:'<ul><li>Simples: no salvan más de 5 m salvo reforzadas en el centro; prohibidas sobre 7 m (ahí van especiales fijadas, con cinturón de seguridad).</li><li>Apoyo en superficie plana y firme, con zapatas antideslizantes o ganchos arriba.</li><li>Sobrepasan 1 m el punto de apoyo superior; los pies a 1/4 de la longitud de la vertical.</li><li>Se sube y baja de frente; una persona por vez; no cargar más de 25 kg.</li><li>Las de madera no se pintan (sólo barniz transparente). Prohibido empalmar dos.</li></ul>',

inc_maq:{t:'Salas de máquinas y corte de energía',k:['sala de maquinas','salas de maquinas','corte de gas','corte de electricidad','linea municipal','cortar suministro','emergencia'],

 c:D351+', puntos 6.1.3 y 6.1.6.'},

/* ---------- TEMA 4: 5 REGLAS DE ORO ---------- */
r_lista:{t:'Lista de chequeo: las 5 Reglas de Oro',k:['5 reglas','cinco reglas','reglas de oro','lista de chequeo','chequeo','consigna','trabajo sin tension','sin tension'],
 p:'<p>Antes de tocar una instalación, tildá mentalmente en este orden:</p><ul><li>☐ <b>1. Desconectar</b> de todas las fuentes.</li><li>☐ <b>2. Prevenir cualquier posible realimentación</b> (bloqueo y señalización).</li><li>☐ <b>3. Verificar la ausencia de tensión.</b></li><li>☐ <b>4. Poner a tierra y en cortocircuito.</b></li><li>☐ <b>5. Proteger frente a elementos próximos en tensión y señalizar la zona de trabajo.</b></li></ul><p>Elegí una regla en los botones para ver el detalle.</p>',

r1:{t:'Regla 1: Desconectar',k:['desconectar','regla 1','primera regla','seccionador','aislar','fuentes de alimentacion'],
 p:'<p>La parte donde vas a trabajar se aísla de <b>todas</b> las fuentes de alimentación. El aislamiento puede ser una distancia en aire o un aislante interpuesto. Se puede desconectar con equipos automáticos o con pértigas de la distancia adecuada. Ojo: esto sólo empieza el proceso, todavía no garantiza que no haya tensión.</p>',
 c:REV+', regla 1.º (p. 50).'},
r2:{t:'Regla 2: Prevenir realimentación',k:['realimentacion','regla 2','segunda regla','candado','bloqueo','cartel','enclavamiento','reconexion'],

 c:REV+', regla 2.º (pp. 50 y 51).'},
r3:{t:'Regla 3: Verificar ausencia de tensión',k:['verificar','ausencia de tension','regla 3','tercera regla','detector','detectores','iec 61243','probar','pertiga','tester'],

r5:{t:'Regla 5: Proteger y señalizar la zona',k:['proteger','senalizar','senalizacion','regla 5','quinta regla','zona de trabajo','delimitar','elementos proximos'],

   3. SONIDOS (Web Audio API, sin archivos externos)
   Cada tipo de botón tiene su propio sonido. Editá frecuencias aquí.

let ctx;
function nota(f,dur,tipo,ini){
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+(ini||0);
  o.type=tipo;o.frequency.value=f;
  g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur);
}
const SON={
  tema:()=>{nota(330,.09,'square');nota(495,.12,'square',.09)},  /* botón de tema */
  item:()=>{nota(600,.14,'triangle')},                           /* botón de subtema */
  envio:()=>{nota(440,.07,'sawtooth');nota(880,.1,'sawtooth',.07)}, /* enviar consulta */
  volver:()=>{nota(500,.09,'sine');nota(300,.14,'sine',.09)},    /* volver al menú */
  modo:()=>{nota(700,.06,'square');nota(500,.06,'square',.08);nota(700,.08,'square',.16)}
};
const sonar=n=>{try{SON[n]()}catch(e){}};

/* =====================================================================
   4. LÓGICA DEL CHAT (no hace falta tocar para agregar normativas)
   ===================================================================== */
const log=document.getElementById('log'),inp=document.getElementById('q');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;:]/g,' ');

function burbuja(cls,html){
  const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;log.appendChild(d);
  log.scrollTop=log.scrollHeight;return d;
}
function botones(lista){ /* lista: [{txt, fn, clase, snd}] */
  const w=document.createElement('div');w.className='ops';
  lista.forEach(o=>{const b=document.createElement('button');b.type='button';b.textContent=o.txt;
    if(o.g)b.className='g';
    b.onclick=()=>{sonar(o.snd);o.fn()};w.appendChild(b)});
  return w;
}
function menuTemas(msg){
  const d=burbuja('b','<p>'+msg+'</p>');
  d.appendChild(botones(TEMAS.map(t=>({txt:t.n,snd:'tema',fn:()=>{burbuja('u',t.n);verTema(t)}}))));
}
function verTema(t){
  const d=burbuja('b','<p><b>'+t.n+'</b>. ¿Qué querés repasar?</p>');
  const l=t.items.map(id=>({txt:KB[id].t,snd:'item',fn:()=>{burbuja('u',KB[id].t);responder(id)}}));
  l.push({txt:'Volver al menú',g:1,snd:'volver',fn:()=>menuTemas('Elegí un tema:')});
  d.appendChild(botones(l));
}
/* Respuesta en 2 partes: a) explicación práctica, b) cita exacta */
function responder(id){
  const e=KB[id];
  const d=burbuja('b','<h3>'+e.t+'</h3><div class="pt">🔧 En el taller</div>'+e.p+'<div class="cita"><b>📖 Cita:</b> '+e.c+'</div>');
  d.appendChild(botones([{txt:'Volver al menú',g:1,snd:'volver',fn:()=>menuTemas('Elegí un tema:')}]));
}
/* Búsqueda por palabras clave: compara raíces de palabras (tolera plurales y errores chicos).
   Gana la entrada con más coincidencias. Los códigos tipo IP54 o IPX5 van directo a los ejemplos IP. */
const STOP=['que','como','cual','cuales','cuanto','cuantos','dice','significa','para','por','con','del','los','las','una','uno','hay','son','ser','esta','este','sobre','decime','explicame','quiero','necesito','hola','the'];
const raices=s=>norm(s).split(/\s+/).filter(w=>w.length>=3&&!STOP.includes(w));
function buscar(txt){
  if(/\bip\s?([0-6x][0-8x]?[a-d]?)\b/.test(norm(txt)))return 'ip_ej';
  const qs=raices(txt);let mejor=null,max=0;
  for(const id in KB){
    const ws=raices(KB[id].k.join(' ')+' '+KB[id].t);let s=0;
    qs.forEach(w=>{if(ws.some(x=>x===w||(w.length>=4&&x.length>=4&&(x.startsWith(w.slice(0,5))||w.startsWith(x.slice(0,5))))))s+=w.length>=4?2:1});
    if(s>max){max=s;mejor=id}}
  return max>=2?mejor:null;
}
function consulta(txt){
  const q=norm(txt),pal=q.split(/\s+/);
  burbuja('u',txt.replace(/</g,'&lt;'));
  if(OFENSA.some(w=>pal.includes(w)))return burbuja('b','<p>'+RESPETO+'</p>');
  const id=buscar(txt);
  if(id)return responder(id);
  if(DERIVAR.some(w=>w.includes(' ')?q.includes(w):pal.includes(w)))return burbuja('b','<p>'+DERIVA+'</p>');
  menuTemas(NOSE);
}
document.getElementById('f').onsubmit=e=>{
  e.preventDefault();const v=inp.value.trim();if(!v)return;
  sonar('envio');inp.value='';consulta(v);
};
/* Modo oscuro por defecto; el botón alterna */
const th=document.getElementById('th');
th.onclick=()=>{
  const r=document.documentElement,c=r.dataset.theme==='dark'?'light':'dark';
  r.dataset.theme=c;th.textContent=c==='dark'?'Modo claro':'Modo oscuro';sonar('modo');
};
window.onerror=m=>{burbuja('b','<p>Error técnico: '+m+'. Avisale a tu profe.</p>')};
menuTemas(SALUDO);
</script>
